[package]
name = "garmin-connect"
version = "0.1.0"
description = "Minimal unofficial Garmin Connect client: SSO login (with MFA), OAuth1→OAuth2 exchange, authenticated GETs"
edition = "2021"

[dependencies]
# Same reqwest/TLS stack tauri-plugin-http already builds (rustls, no OpenSSL —
# which matters on Android).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"
percent-encoding = "2"
regex = "1"
url = "2"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
